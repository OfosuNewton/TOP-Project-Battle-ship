<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate BattleShip</title>
    <script type="module" src="322ed3805280d3e0be2b.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<script defer src="main.js"></script></head>
<body>
    <div class="main-element">
    <div class="header-container">
        <div class="header">Ultimate BattleShip🚢</div>
        <div class="place_ship" id="game_status">Align your ships in position!</div>
        <div class="your-fleet">
            <div class="ship_list">
                <!-- Carrier -->
                <div class="ship-option"
                draggable="true"
                data-ship="carrier"
                data-length="5">
                <span class="ship-name">Carrier</span>
                <div class="ship-preview">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- Battleship -->
             <div class="ship-option"
             draggable="true"
             data-ship="battleship"
             data-length="4">
            <span class="ship-name">Battleship</span>
            <div class="ship-preview">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            </div>
            <!-- cruiser -->
            <div class="ship-option" draggable="true" data-ship="cruiser" data-length="3">
                <span class="ship-name">Cruiser</span>
                <div class="ship-preview">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- submarine -->
             <div class="ship-option"
             draggable="true"
             data-ship="submarine"
             data-length="3">
                <span class="ship-name">Submarine</span>
                <div class="ship-preview">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- Destroyer -->
            <div class="ship-option" draggable="true" data-ship="destroyer" data-length="2">
                <span class="ship-name">Destroyer</span>
                <div class="ship-preview">
                    <span></span>
                    <span></span>
                </div>
            </div>
            </div>
        </div>
        <div class="start-options">
            <button class="axis" type="button">Axis: Vertical</button>
            <button class="startGame" type="button" disabled>Start Game</button>
            <p class="ships-remaining">
                Ships remaining: <span id="ships-remaining">5</span>
            </p>
        </div>
    </div>
    <div class="main-containter">
    <div class="board-section">
        <div id="player-board"></div>
        <h2 class="players">Player Teritory</h2>
    </div>
    
    <div class="board-section">
        <div id="computer-board"></div>
        <h2 class="players">Computer Teritory</h2>
    </div>
    
    <div class="game-over-overlay hidden" id="game-over">
        <div class="game-over-content">
            <h1 id="game-over-title">Game Over!</h1>
            <p id="game-over-message"></p>
            <button id="play-again">Play Again</button>
        </div>
    </div>
    </div>
   
</body>
</html>
